<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <!-- Brand Cyan-Blue to Purple Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Vibrant Glow Gradient for Visor / Signal -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Dark Navy / Black Background with Subtle Border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#1E293B" stroke-width="1" />

  <!-- Lead Generation Upward Apex Arrow / Signal Antenna (Growth Motif) -->
  <path d="M32 7L39 15H25L32 7Z" fill="url(#brandGrad)" />
  <rect x="30" y="14" width="4" height="5" rx="1" fill="#38BDF8" />

  <!-- AI Robot Agent Head (Clean Geometric Silhouette) -->
  <rect x="14" y="19" width="36" height="30" rx="9" fill="url(#brandGrad)" />

  <!-- Subtle Inner Face Mask Plate (High Contrast Dark Cutout) -->
  <rect x="18" y="23" width="28" height="22" rx="6" fill="#07090E" />

  <!-- Robot Side Ears / Transmitters -->
  <rect x="10" y="28" width="4" height="12" rx="2" fill="#38BDF8" />
  <rect x="50" y="28" width="4" height="12" rx="2" fill="#8B5CF6" />

  <!-- AI Visor / Lead Radar Eyes (Electric Cyan & Blue) -->
  <rect x="22" y="28" width="7" height="6" rx="2" fill="#38BDF8" />
  <rect x="35" y="28" width="7" height="6" rx="2" fill="#60A5FA" />

  <!-- Lead Gen / Sales Connection Pulse (Upward Growth Bar) -->
  <path d="M24 39C27 37 37 37 40 39" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
